name = "emdomanus/bootstrap"
version = "0.1.0"
description = "Typed profile construction, wiring, startup, and owned teardown for Roblox applications."
license = "MIT"
authors = ["emdomanus"]
repository = "https://github.com/emdomanus/bootstrap"

includes = [
	"pesde.toml",
	"LICENSE",
	"README.md",
	"src/**/*.luau",
]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"
